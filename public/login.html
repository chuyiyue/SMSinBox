<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title data-i18n="auth.documentTitle">登录 · SMSinBox</title>
    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f7f7f8" />
    <script src="/pwa.js"></script>
    <script src="/theme-boot.js"></script>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="auth-body">
    <main class="auth-card">
      <a class="brand" href="/">
        <span class="mark" aria-hidden="true">
          <img src="/logo.png" width="18" height="18" alt="" />
        </span>
        <span class="brand-name">SMSinBox</span>
      </a>
      <h1 class="auth-title">SMSinBox</h1>
      <p id="login-error" class="callout danger auth-error" role="alert" hidden></p>
      <!-- 登录方式列表：密码是第一项；GitHub 登录作为同一列表的新项渲染在
           密码表单下方（用带「或」字的分隔线隔开），仅当服务端配置了
           GitHub OAuth 时由 login.js 显示，否则整块保持隐藏。 -->
      <form id="login-form" class="auth-form">
        <label data-i18n="auth.username">用户名
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            maxlength="128"
            required
            autofocus
          />
        </label>
        <label data-i18n="auth.password">密码
          <span class="password-field">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              maxlength="256"
              required
            />
            <button id="password-toggle" class="icon-btn" type="button" aria-label="显示密码" data-i18n-attr="aria-label:auth.showPassword" aria-pressed="false">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons.svg#icon-eye"/></svg>
            </button>
          </span>
        </label>
        <button id="login-submit" type="submit" data-i18n="auth.signIn">登录</button>
      </form>
      <!-- 验证步骤：与密码共用同一张卡片，不新开页面。 -->
      <form id="totp-form" class="auth-form auth-step" hidden>
        <h2 id="totp-title" class="auth-step-title" data-i18n="auth.totp">两步验证</h2>
        <p id="totp-error" class="callout danger" role="alert" hidden></p>
        <label data-i18n="auth.code">验证码
          <input id="totp-code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="24" placeholder="6 位验证码或恢复码" data-i18n-attr="placeholder:auth.codePlaceholder" required />
        </label>
        <button id="totp-submit" type="submit" data-i18n="auth.verifySignIn">验证并登录</button>
        <button id="totp-cancel" class="ghost" type="button" data-i18n="auth.backToPassword">返回密码登录</button>
      </form>
      <div id="auth-alternatives" class="auth-alternatives" hidden>
        <div class="auth-divider" role="separator"><span data-i18n="auth.or">或</span></div>
        <a id="github-login" class="button secondary auth-github" href="/api/v1/auth/github/start?intent=login" data-i18n="auth.githubLogin">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons.svg#icon-github"/></svg>
          使用 GitHub 登录
        </a>
      </div>
    </main>
    <script type="module" src="/login.js"></script>
  </body>
</html>
