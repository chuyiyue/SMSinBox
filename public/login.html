<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>登录 · SMSinBox</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="auth-body">
    <main class="auth-card">
      <a class="brand" href="/">
        <span class="mark" aria-hidden="true">
          <img src="/mark.svg" width="18" height="18" alt="" />
        </span>
        SMSinBox
      </a>
      <h1>登录收件箱</h1>
      <p class="lede">短信只在你的 Cloudflare 账号里。第一次登录会用 Worker 密钥中的管理员账号完成初始化。</p>
      <form id="login-form">
        <label>用户名<input name="username" autocomplete="username" required maxlength="64" /></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" required /></label>
        <p id="login-error" class="error" hidden></p>
        <button type="submit">登录</button>
      </form>
    </main>
    <script type="module" src="/login.js"></script>
  </body>
</html>
