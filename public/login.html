<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>登录 · SMSinBox</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script src="/theme-boot.js"></script>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="auth-body">
    <main class="auth-card">
      <a class="brand" href="/">
        <span class="mark" aria-hidden="true">
          <img src="/mark.svg" width="18" height="18" alt="" />
        </span>
        <span class="brand-name">SMSinBox</span>
      </a>
      <h1 class="auth-title">SMSinBox</h1>
      <p class="lede">你自己的短信收件箱</p>
      <form id="login-form">
        <p id="login-error" class="callout danger" hidden></p>
        <label>用户名
          <input id="username" name="username" autocomplete="username" required maxlength="64" />
        </label>
        <label>密码
          <span class="password-field">
            <input id="password" name="password" type="password" autocomplete="current-password" required />
            <button id="password-toggle" class="icon-btn" type="button" aria-label="显示密码" aria-pressed="false">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </span>
        </label>
        <button id="login-submit" type="submit">登录</button>
      </form>
      <form id="totp-form" hidden>
        <p id="totp-error" class="callout danger" hidden></p>
        <p class="subtle">输入身份验证器上的 6 位验证码，或使用一次性恢复码。</p>
        <label>验证码
          <input id="totp-code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="24" required />
        </label>
        <button id="totp-submit" type="submit">验证并登录</button>
        <button id="totp-cancel" class="ghost" type="button">返回密码登录</button>
      </form>
      <p class="auth-note">没有账号？请联系管理员添加。</p>
    </main>
    <script type="module" src="/login.js"></script>
  </body>
</html>
