<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>设备 · SMSinBox</title>
    <link rel="icon" href="/logo.png" type="image/png" />
    <script src="/theme-boot.js"></script>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="/">
          <span class="mark" aria-hidden="true"><img src="/logo.png" width="18" height="18" alt="" /></span>
          <span class="brand-name">SMSinBox</span>
        </a>
        <nav class="sidebar-nav" aria-label="主导航">
        </nav>
        <div class="sidebar-devices" aria-labelledby="sidebar-devices-title">
          <div class="sidebar-label-row">
            <button type="button" class="sidebar-section-toggle ghost" id="sidebar-devices-toggle" aria-expanded="true" aria-controls="sidebar-devices" title="收起设备列表" aria-label="收起设备列表">
              <svg class="icon chevron" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons.svg#icon-chevron-down"/></svg>
              <span class="sidebar-label" id="sidebar-devices-title">设备</span>
            </button>
          </div>
          <div id="sidebar-devices" class="device-list"></div>
        </div>
        <div class="sidebar-footer">
          <a class="account-btn" href="/users.html" title="系统管理" aria-label="系统管理">
            <span class="account-avatar" id="sidebar-avatar" aria-hidden="true">管</span>
            <span class="account-name btn-label" id="sidebar-account-name">管理员</span>
          </a>
          <button class="account-logout ghost" type="button" data-logout title="退出登录" aria-label="退出登录">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons.svg#icon-log-out"/></svg>
            <span class="btn-label">退出登录</span>
          </button>
        </div>
        <script src="/registry.js"></script>
        <script src="/sidebar-boot.js"></script>
      </aside>
      <div class="main">
        <header class="topbar">
          <button id="menu-toggle" class="ghost icon-btn" type="button" aria-label="打开导航" aria-expanded="false" aria-controls="sidebar">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons.svg#icon-menu"/></svg>
          </button>
          <h1 class="topbar-title">设备</h1>
          <form class="search-wrap" action="/" method="get" role="search">
            <input class="topbar-search" type="search" name="q" maxlength="80" placeholder="搜索正文、号码或验证码" aria-label="搜索短信" />
          </form>
          <button id="search-toggle" class="icon-btn" type="button" aria-label="搜索">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons.svg#icon-search"/></svg>
          </button>
          <div class="topbar-actions">
            <button class="ghost icon-btn" type="button" data-theme-toggle aria-label="主题：跟随系统">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons.svg#icon-sun"/></svg>
              <span class="btn-label sr-only">主题：跟随系统</span>
            </button>
            <button id="add-device" class="primary" type="button">添加设备</button>
            <button id="refresh" class="ghost icon-btn" type="button" aria-label="刷新">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons.svg#icon-refresh"/></svg>
            </button>
          </div>
        </header>
        <div class="page">
          <div class="page-notices">
            <p id="device-error" class="callout danger" hidden></p>
            <p id="device-status" class="callout ok" hidden></p>
          </div>
          <template id="add-device-template">
            <section class="add-device-panel">
              <div class="add-device-head">
                <h2 id="add-device-title">添加设备</h2>
              </div>
              <form id="device-form" class="add-device-form">
                <label class="sr-only" for="device-name">设备名称</label>
                <input id="device-name" name="name" required maxlength="64" placeholder="设备名称，例如：我的 Pixel" autocomplete="off" />
                <button type="submit">添加设备</button>
              </form>
              <div id="token-box" class="token-box" hidden role="status">
                <p class="callout warn">这些凭证只显示这一次，关闭后无法再次查看。</p>
                <div id="bearer-wrap" class="stack" hidden>
                  <strong>Bearer token，只显示这一次</strong>
                  <code id="token-value"></code>
                  <p>请立刻保存。关闭或刷新页面后无法再查看。请求头使用 <code>Authorization: Bearer &lt;token&gt;</code>。Android 和已经装好的旧快捷指令继续用它。丢失后要删除设备并新建。</p>
                  <button id="copy-token" class="secondary" type="button">复制 token</button>
                </div>
                <div id="push-wrap" class="stack" hidden>
                  <strong>推送链接，只显示这一次</strong>
                  <code id="push-url-value"></code>
                  <p>贴进已经装好的那一条快捷指令。它等同设备密钥，不要发到聊天或工单。数据库只保存哈希，刷新后不能再显示明文。丢掉请在这台设备上点「轮换」。</p>
                  <button id="copy-push-url" class="secondary" type="button">复制推送链接</button>
                </div>
                <label><input id="token-saved" type="checkbox" /> 我已保存好</label>
                <div class="add-device-actions">
                  <button id="token-done" type="button" disabled>完成</button>
                </div>
              </div>
            </section>
          </template>

          <div class="tabs api-tabs devices-page-tabs" role="tablist" aria-label="设备页面视图">
            <button class="tab is-active" id="dtab-list" type="button" role="tab" aria-selected="true" aria-controls="dpanel-list">设备列表</button>
            <button class="tab" id="dtab-guide" type="button" role="tab" aria-selected="false" aria-controls="dpanel-guide">接入指引</button>
          </div>

          <section class="devices-section" id="dpanel-list" role="tabpanel" aria-labelledby="devices-title">
            <div class="section-head">
              <h2 id="devices-title">我的设备</h2>
            </div>
            <div id="devices" class="devices cards"></div>
          </section>

          <section id="dpanel-guide" role="tabpanel" aria-label="接入指引" hidden>
            <div id="device-guide" class="device-guide stack"></div>
          </section>

          <template id="api-config-template">
            <section class="api-config">
              <h3 class="api-config-title">API 配置</h3>
              <dl class="api-facts">
                <div>
                  <dt>请求地址</dt>
                  <dd>
                    <code id="sms-url"></code>
                    <button id="copy-sms-url" class="secondary" type="button">复制地址</button>
                  </dd>
                </div>
                <div>
                  <dt>请求方法</dt>
                  <dd><code>POST</code></dd>
                </div>
                <div>
                  <dt>Authorization</dt>
                  <dd>
                    <code>Bearer &lt;设备 token&gt;</code>
                    <button id="copy-auth" class="secondary" type="button">复制</button>
                  </dd>
                </div>
                <div>
                  <dt>Content-Type</dt>
                  <dd><code>application/json</code></dd>
                </div>
              </dl>
              <p class="subtle">限流：60 次 / 分钟。</p>
              <details class="fold">
                <summary>JSON 请求体模板</summary>
                <div class="code-block">
                  <button id="copy-template" class="secondary copy-corner" type="button">复制模板</button>
                  <pre id="android-template"></pre>
                </div>
              </details>
              <details class="fold">
                <summary>curl 示例</summary>
                <div class="code-block">
                  <button id="copy-curl" class="secondary copy-corner" type="button">复制</button>
                  <pre id="curl-sample"></pre>
                </div>
              </details>
            </section>
          </template>

          <template id="setup-guide-template">
            <details class="fold setup-details" id="setup-details">
              <summary id="setup-title">接入指引（iOS / Android / 通用 API）</summary>
              <div class="tabs" role="tablist" aria-label="配置平台">
                <button class="tab is-active" type="button" data-tab="ios" role="tab" aria-selected="true">iOS</button>
                <button class="tab" type="button" data-tab="android" role="tab" aria-selected="false">Android</button>
                <button class="tab" type="button" data-tab="api" role="tab" aria-selected="false">通用 API</button>
              </div>
              <div data-panel="ios">
                <h3>版本与配置状态</h3>
                <ul class="status-list" id="shortcut-status">
                  <li>推荐：打开 iCloud 分享链接安装 SMSinBox Next（已签名）。导入后只填写推送链接。</li>
                  <li>备用：设备页可下载未签名的 SMSinBox-iOS.shortcut；iOS 15 及更高版本可能拒绝导入。</li>
                  <li>iCloud：https://www.icloud.com/shortcuts/cdfde24d823a43318ee651bb4d2c9494 。不要使用来路不明的其它分享链接。</li>
                  <li>配置状态：本页看不到手机上的自动化开关。自动化里 content 必须用「信息 › 内容」，不要用「快捷指令输入」。收到 device 为 iOS 的短信后，设备卡片会写成「已收到 iOS 短信」。发送测试消息不会写成 iOS。</li>
                </ul>
                <details class="fold">
                  <summary>导入快捷指令</summary>
                  <ol>
                    <li>先在上方添加设备，复制黄框里的推送链接。刷新后无法再看，丢掉就在设备卡片里轮换。</li>
                    <li>推荐打开 <a href="https://www.icloud.com/shortcuts/cdfde24d823a43318ee651bb4d2c9494" target="_blank" rel="noopener">iCloud 分享链接</a>安装 SMSinBox Next（已签名）。系统拒绝时可下载 <a class="button secondary" href="/api/v1/ios/shortcut?variant=all" download="SMSinBox-iOS.shortcut">备用未签名文件</a>。</li>
                    <li>导入时只填写推送链接，不要把链接发给别人。备用文件未签名，iOS 15 及更高版本经常拒绝导入。</li>
                    <li>打开「快捷指令」→「自动化」，选择这条快捷指令的触发器，打开自动化开关，关闭「运行前询问」（或「运行前确认」）。有「锁定时允许运行」就打开它。</li>
                    <li>条件选「信息包含一个空格」覆盖全部短信；只收验证码时改成包含「验证码」，并再加一条包含 <code>code</code>。短码没有空格，空格条件匹配不到。</li>
                    <li>保存。手机重启后需先解锁一次，自动化才会继续运行。</li>
                  </ol>
                </details>
                <details class="fold">
                  <summary>测试转发</summary>
                  <ol>
                    <li>用另一台手机发送一条「验证码 123456」，确认收件箱出现短信。</li>
                    <li>也可以点设备卡片的「发送测试消息」。它只把测试短信写进服务器收件箱，不会让运营商发短信，也不会让设备平台变成 iOS。</li>
                    <li>收到后设备卡片的「最近活动」会更新。自动化里 <code>content</code> 必须用「信息 › 内容」，不要用「快捷指令输入」。</li>
                    <li>返回「请求过于频繁」是 429，「推送链接无效 / 已撤销」是 401，需要轮换链接；网络失败或停在「获取 URL 内容」通常是链接为空或网络问题。</li>
                  </ol>
                </details>
                <details class="fold">
                  <summary>手动添加「获取 URL 内容」</summary>
                  <ol>
                    <li>按上面的系统版本新建「信息」自动化，选择「立即运行」并关闭询问。</li>
                    <li>「信息 › 内容」为空时停止；「信息 › 发件人」为空时用文本「（发件人为空）」，结果设为变量「发件人」。</li>
                    <li>添加「文本」填入推送链接，再添加「获取 URL 内容」：URL 选文本，方法 POST，打开显示标头。</li>
                    <li>标头只加 <code>Content-Type: application/json</code>，不要加 Authorization。</li>
                    <li>请求体选 JSON：<code>from</code> 用变量「发件人」，<code>content</code> 用「信息 › 内容」，<code>timestamp</code> 用当前日期，<code>device</code> 填 iOS。</li>
                  </ol>
                </details>
                <details class="fold">
                  <summary>已有快捷指令（Bearer）</summary>
                  <ol>
                    <li>已经装好的旧快捷指令不用改，继续 POST 到 <code>/api/v1/sms</code>。</li>
                    <li>请求头使用 <code>Authorization: Bearer &lt;设备 token&gt;</code> 和 <code>Content-Type: application/json</code>。</li>
                    <li>请求体字段不变：<code>from</code>、<code>content</code>、<code>timestamp</code>、<code>device</code>。设备 token 丢失后需删除设备并重建。</li>
                  </ol>
                </details>
              </div>
              <div data-panel="android" hidden>
                <h3>Android · SmsForwarder</h3>
                <ol>
                  <li>安装 <a href="https://github.com/pppscn/SmsForwarder" rel="noopener noreferrer" target="_blank">SmsForwarder</a>，授予短信和通知权限。</li>
                  <li>添加发送通道，类型选 Webhook，方法选 POST。</li>
                  <li>URL 填上方「API 配置」里的完整请求地址（不是设备 ID）。</li>
                  <li>请求头添加 <code>Authorization: Bearer 设备token</code> 和 <code>Content-Type: application/json</code>。</li>
                  <li>请求体使用上方 JSON 模板。规则里可加关键字「验证码」，少收无关短信。</li>
                </ol>
              </div>
              <div data-panel="api" hidden>
                <h3>通用 API</h3>
                <ol>
                  <li>向上方完整地址发送 <code>POST</code> 请求，JSON 请求体至少包含正文内容。</li>
                  <li>认证使用 <code>Authorization: Bearer &lt;设备 token&gt;</code>，并设置 <code>Content-Type: application/json</code>。</li>
                  <li>推送链接 <code>/api/v1/ingest/psh_...</code> 不需要 Authorization，适合快捷指令。</li>
                </ol>
                <table class="user-table">
                  <thead><tr><th>字段</th><th>别名</th></tr></thead>
                  <tbody>
                    <tr><td data-label="字段">content</td><td data-label="别名">text、msg、body、sms</td></tr>
                    <tr><td data-label="字段">from</td><td data-label="别名">sender</td></tr>
                    <tr><td data-label="字段">timestamp</td><td data-label="别名">receive_time</td></tr>
                    <tr><td data-label="字段">to、device、sim</td><td data-label="别名">没有别名</td></tr>
                  </tbody>
                </table>
              </div>
            </details>
          </template>
        </div>
      </div>
    </div>
    <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>
    <script type="module" src="/devices.js"></script>
  </body>
</html>
