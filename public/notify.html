<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>推送渠道 · SMSinBox</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script src="/theme-boot.js"></script>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="/">
          <span class="mark" aria-hidden="true"><img src="/mark.svg" width="18" height="18" alt="" /></span>
          <span class="brand-name">SMSinBox</span>
        </a>
        <nav class="sidebar-nav" aria-label="主导航">
          <noscript>
            <a href="/">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 7 9-7"/></svg>
              <span class="nav-label">收件箱</span>
            </a>
            <a href="/devices.html">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
              <span class="nav-label">设备列表</span>
            </a>
            <a class="active" aria-current="page" href="/notify.html">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
              <span class="nav-label">推送渠道</span>
            </a>
            <a href="/api-mcp.html">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg>
              <span class="nav-label">API 与 MCP</span>
            </a>
            <a href="/users.html">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
              <span class="nav-label">系统管理</span>
            </a>
          </noscript>
        </nav>
        <div class="sidebar-devices" aria-labelledby="sidebar-devices-title">
          <div class="sidebar-label-row">
            <button type="button" class="sidebar-section-toggle ghost" id="sidebar-devices-toggle" aria-expanded="true" aria-controls="sidebar-devices" title="收起设备列表" aria-label="收起设备列表">
              <svg class="icon chevron" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons.svg#icon-chevron-down"/></svg>
              <span class="sidebar-label" id="sidebar-devices-title">设备</span>
            </button>
            <a class="ghost icon-btn sidebar-add" href="/devices.html#add" aria-label="添加设备" title="添加设备">+</a>
          </div>
          <div id="sidebar-devices" class="device-list"></div>
        </div>
        <div class="sidebar-footer">
          <a class="account-btn" href="/users.html" title="系统管理" aria-label="系统管理">
            <span class="account-avatar" id="sidebar-avatar" aria-hidden="true">管</span>
            <span class="account-name btn-label" id="sidebar-account-name">管理员</span>
          </a>
          <button class="account-logout ghost" type="button" data-logout title="退出登录" aria-label="退出登录">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span class="btn-label">退出登录</span>
          </button>
        </div>
        <script src="/sidebar-boot.js"></script>
      </aside>
      <div class="main">
        <header class="topbar">
          <button id="menu-toggle" class="ghost icon-btn" type="button" aria-label="打开导航" aria-expanded="false" aria-controls="sidebar">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <h1 class="topbar-title">推送渠道</h1>
          <form class="search-wrap" action="/" method="get" role="search">
            <input class="topbar-search" type="search" name="q" maxlength="80" placeholder="搜索正文、号码或验证码" aria-label="搜索短信" />
          </form>
          <button id="search-toggle" class="icon-btn" type="button" aria-label="搜索">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          </button>
          <div class="topbar-actions">
            <button class="ghost icon-btn" type="button" data-theme-toggle aria-label="主题：跟随系统">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
              <span class="btn-label sr-only">主题：跟随系统</span>
            </button>
            <span id="channel-count" class="count-pill">0 / 10</span>
            <button id="add-channel" class="primary" type="button">添加渠道</button>
            <button id="refresh" class="ghost icon-btn" type="button" aria-label="刷新">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.2-5.5M20 4v6h-6"/></svg>
            </button>
          </div>
        </header>
        <div class="page">
          <p id="notify-error" class="callout danger" hidden></p>
          <p id="notify-status" class="callout ok" hidden></p>
          <div id="notify-list" class="channel-grid"></div>
          <p class="privacy">渠道配置保存在你自己的 D1 数据库中；日志不会记录正文、token 或密码。</p>
        </div>
      </div>
    </div>
    <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>
    <dialog id="notify-dialog" class="modal wide">
      <div class="modal-card">
        <h2 id="notify-dialog-title">添加渠道</h2>
        <div id="kind-step">
          <div id="notify-kinds" class="kind-grid"></div>
          <div class="modal-actions">
            <button id="notify-close" class="secondary" type="button">取消</button>
          </div>
        </div>
        <form id="notify-form" class="stack" hidden>
          <div id="notify-fields"></div>
          <p id="notify-form-error" class="field-error" hidden></p>
          <div class="modal-actions">
            <button id="notify-back" class="secondary" type="button">返回</button>
            <button type="submit">添加</button>
          </div>
        </form>
        <div id="notify-view" class="stack" hidden>
          <div id="notify-view-fields"></div>
          <div class="modal-actions">
            <button id="notify-view-close" class="secondary" type="button">关闭</button>
          </div>
        </div>
      </div>
    </dialog>
    <script type="module" src="/notify.js"></script>
  </body>
</html>
