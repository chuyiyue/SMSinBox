<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>系统管理 · SMSinBox</title>
    <link rel="icon" href="/logo.png" type="image/png" />
    <script src="/theme-boot.js"></script>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar" id="sidebar">
        <script src="/registry.js"></script>
        <script src="/sidebar-boot.js"></script>
      </aside>
      <div class="main">
        <header class="topbar">
          <button id="menu-toggle" class="ghost icon-btn" type="button" aria-label="打开导航" aria-expanded="false" aria-controls="sidebar">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons.svg#icon-menu"/></svg>
          </button>
          <h1 class="topbar-title">系统管理</h1>
          <div class="topbar-actions">
            <button class="ghost icon-btn" type="button" data-theme-toggle aria-label="主题：跟随系统">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons.svg#icon-sun"/></svg>
              <span class="btn-label sr-only">主题：跟随系统</span>
            </button>
            <button id="refresh" class="ghost icon-btn" type="button" aria-label="刷新">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons.svg#icon-refresh"/></svg>
            </button>
          </div>
        </header>
        <div class="page">
          <p id="page-error" class="callout danger" hidden></p>
          <p id="page-retry" class="callout warn" hidden>
            <span>页面数据没有加载成功。</span>
            <button id="page-retry-button" class="secondary" type="button">重试</button>
          </p>

          <div class="settings">

            <div class="settings-body">
              <section id="account-panel" class="settings-section panel stack" aria-labelledby="account-title">
                <h2 id="account-title">管理员账号</h2>
                <p id="account-error" class="callout danger" hidden></p>
                <p id="account-status" class="callout ok" hidden></p>

                <form id="profile-form" class="stack" novalidate>
                  <h3>用户名</h3>
                  <label>用户名
                    <input id="profile-username" name="username" type="text" maxlength="39" autocomplete="off" autocapitalize="none" spellcheck="false" />
                  </label>
                  <p class="subtle">仅用于显示与头像：与 GitHub 账号同名时显示其头像，其它名字按名生成头像。不用于登录。</p>
                  <p id="profile-error" class="field-error" hidden></p>
                  <div class="actions">
                    <button id="profile-submit" type="submit">保存用户名</button>
                  </div>
                </form>

                <form id="password-form" class="stack" novalidate>
                  <h3>改密码</h3>
                  <label>当前密码
                    <input id="password-current" name="current_password" type="password" required maxlength="256" autocomplete="current-password" />
                  </label>
                  <label>新密码
                    <input id="password" name="password" type="password" required maxlength="256" autocomplete="new-password" />
                  </label>
                  <div id="password-strength" class="strength" data-score="0" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
                  <p class="subtle">8–256 位；保存后需重新登录。</p>
                  <p id="password-error" class="field-error" hidden></p>
                  <div class="actions">
                    <button id="password-submit" type="submit">保存密码</button>
                    <button id="logout" class="secondary" type="button" data-logout>退出登录</button>
                  </div>
                </form>
              </section>

              <section id="sessions-panel" class="settings-section panel stack" aria-labelledby="sessions-title">
                <h2 id="sessions-title">会话管理</h2>
                <p id="sessions-error" class="callout danger" hidden></p>
                <p id="sessions-status" class="callout ok" hidden></p>
                <ul id="session-list" class="session-list" aria-live="polite"></ul>
                <div class="actions">
                  <button id="revoke-others" class="secondary" type="button" disabled>撤销其它会话</button>
                  <button id="sessions-refresh" class="ghost" type="button">刷新列表</button>
                </div>
              </section>

              <section id="totp-panel" class="settings-section panel stack" aria-labelledby="totp-title">
                <h2 id="totp-title">两步验证</h2>
                <p id="totp-state" class="subtle">正在读取两步验证状态…</p>
                <p id="totp-extra" class="subtle"></p>
                <p id="totp-error" class="callout danger" hidden></p>
                <p id="totp-ok" class="callout ok" hidden></p>
                <div id="totp-actions" class="actions"></div>
              </section>

              <section id="system-panel" class="settings-section panel stack" aria-labelledby="system-title">
                <h2 id="system-title">系统信息</h2>
                <dl class="system-facts">
                  <div>
                    <dt>版本</dt>
                    <dd id="fact-version">读取中…</dd>
                  </div>
                  <div>
                    <dt>设备数</dt>
                    <dd id="fact-devices">读取中…</dd>
                  </div>
                  <div>
                    <dt>登录会话</dt>
                    <dd id="fact-sessions">读取中…</dd>
                  </div>
                  <div>
                    <dt>运行环境</dt>
                    <dd>Cloudflare Workers + D1</dd>
                  </div>
                </dl>
              </section>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>
    <script type="module" src="/users.js"></script>
  </body>
</html>
