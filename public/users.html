<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>用户 · SMSinBox</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script src="/theme-boot.js"></script>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="/">
          <span class="mark" aria-hidden="true"><img src="/mark.svg" width="18" height="18" alt="" /></span>
          <span class="brand-name">SMSinBox</span>
        </a>
        <nav class="sidebar-nav" aria-label="主导航">
          <a href="/">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 7 9-7"/></svg>
            <span class="nav-label">收件箱</span>
          </a>
          <a href="/devices.html">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
            <span class="nav-label">设备</span>
          </a>
          <a href="/notify.html">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
            <span class="nav-label">推送</span>
          </a>
          <a id="users-link" class="active" href="/users.html" aria-current="page" hidden>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 19c1.5-3 4-4.5 7-4.5s5.5 1.5 7 4.5"/></svg>
            <span class="nav-label">用户</span>
          </a>
        </nav>
        <div class="sidebar-devices">
          <p class="sidebar-label">设备</p>
          <div id="sidebar-devices"></div>
        </div>
        <div class="sidebar-footer">
          <div class="sidebar-user" id="who" data-who></div>
          <button class="ghost account-btn" type="button" data-theme-toggle>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg>
            <span class="btn-label">主题：跟随系统</span>
          </button>
          <button class="ghost account-btn" type="button" data-help>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 1-1 1.7V14"/><path d="M12 17h.01"/></svg>
            <span class="btn-label">快捷键</span>
          </button>
          <button class="ghost account-btn" type="button" data-logout>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6H6v12h3M10 12h9M15 8l4 4-4 4"/></svg>
            <span class="btn-label">退出登录</span>
          </button>
        </div>
      </aside>
      <div class="main">
        <header class="topbar">
          <h1 class="topbar-title">用户</h1>
          <form class="search-wrap" action="/" method="get" role="search">
            <input class="topbar-search" type="search" name="q" maxlength="80" placeholder="搜索正文、号码或验证码" aria-label="搜索短信" />
          </form>
          <button id="search-toggle" class="icon-btn" type="button" aria-label="搜索">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          </button>
          <div class="topbar-actions">
            <button id="add-user" class="primary" type="button">添加用户</button>
            <button id="refresh" class="ghost icon-btn" type="button" aria-label="刷新">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.2-5.5M20 4v6h-6"/></svg>
            </button>
          </div>
        </header>
        <div class="page">
          <p class="lede">不能停用或删除自己，也不能停用、删除或降级最后一位管理员。</p>
          <p id="user-error" class="callout danger" hidden></p>
          <p id="user-status" class="callout ok" hidden></p>
          <div id="user-empty" class="empty-state" hidden>
            <h2 class="empty-title">还没有用户</h2>
            <p>管理员可以在这里添加能登录的账号。</p>
          </div>
          <table class="user-table" id="user-table" hidden>
            <thead>
              <tr>
                <th>用户名</th>
                <th>角色</th>
                <th>状态</th>
                <th>创建时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="users"></tbody>
          </table>
        </div>
      </div>
    </div>
    <nav class="tabbar" aria-label="页面">
      <a href="/">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 7 9-7"/></svg>
        收件箱
      </a>
      <a href="/devices.html">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
        设备
      </a>
      <a href="/notify.html">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        推送
      </a>
      <button id="more-toggle" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18" cy="12" r="1"/></svg>
        更多
      </button>
    </nav>
    <div id="more-sheet" class="sheet" hidden>
      <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="more-title">
        <h2 id="more-title">更多</h2>
        <a id="users-tab" href="/users.html" hidden>用户</a>
        <button class="ghost" type="button" data-theme-toggle><span class="btn-label">主题：跟随系统</span></button>
        <button class="ghost" type="button" data-help>快捷键</button>
        <button class="ghost" type="button" data-logout>退出登录</button>
        <button id="more-close" class="secondary" type="button">关闭</button>
      </div>
    </div>
    <dialog id="user-dialog" class="modal">
      <form id="user-form" class="modal-card stack">
        <h2 id="user-dialog-title">添加用户</h2>
        <label>用户名
          <input id="new-username" name="username" required maxlength="64" autocomplete="off" placeholder="例如：alice" />
        </label>
        <p class="subtle">字母或数字开头，可含 . _ -，最长 64。</p>
        <p id="username-error" class="field-error" hidden></p>
        <label>初始密码
          <input id="new-password" name="password" type="password" required maxlength="256" autocomplete="new-password" />
        </label>
        <div id="password-strength" class="strength" data-score="0" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <button id="generate-password" class="ghost" type="button">生成强密码</button>
        <p id="password-error" class="field-error" hidden></p>
        <fieldset>
          <legend>角色</legend>
          <label><input type="radio" name="role" value="member" checked /> 普通用户</label>
          <label><input type="radio" name="role" value="admin" /> 管理员</label>
        </fieldset>
        <p id="user-form-error" class="field-error" hidden></p>
        <div class="modal-actions">
          <button id="user-cancel" class="secondary" type="button">取消</button>
          <button id="user-submit" type="submit">添加用户</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/users.js"></script>
  </body>
</html>
