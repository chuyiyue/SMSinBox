<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>收件箱 · SMSinBox</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="/">
          <span class="mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 32 32"><path d="M5 10h22v14H5z" fill="none" stroke="#0e6b4f" stroke-width="2"/><path d="M5 12l11 8 11-8" fill="none" stroke="#0e6b4f" stroke-width="2"/></svg>
          </span>
          SMSinBox
        </a>
        <a class="sidebar-compose" href="/devices.html#device-form">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          新建设备
        </a>
        <nav class="sidebar-nav" aria-label="主导航">
          <a class="active" href="/" aria-current="page">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 7 9-7"/></svg>
            收件箱
          </a>
          <a href="/devices.html">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
            设备管理
          </a>
          <a href="/notify.html">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
            推送设置
          </a>
          <a id="users-link" href="/users.html" hidden>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 19c0-3.3 3.1-5.5 7-5.5s7 2.2 7 5.5"/></svg>
            用户管理
          </a>
        </nav>
        <div class="sidebar-devices">
          <p class="sidebar-label">设备</p>
          <div id="sidebar-devices"></div>
        </div>
        <div class="sidebar-footer">
          <div>
            <div class="sidebar-user" id="who" data-who></div>
            <div class="sidebar-note">已登录</div>
          </div>
          <button id="logout" class="sidebar-logout" type="button" data-logout>退出</button>
        </div>
      </aside>
      <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>
      <div class="main">
        <header class="topbar">
          <button class="hamburger" id="menu-toggle" type="button" aria-label="打开菜单" aria-expanded="false" aria-controls="sidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <h1 class="topbar-title">收件箱</h1>
          <input class="topbar-search" form="filters" type="search" name="q" maxlength="48" placeholder="搜索正文、号码或验证码" />
          <div class="topbar-actions">
            <button id="refresh" class="secondary" type="button">刷新</button>
            <span class="topbar-user" data-who></span>
            <button class="secondary" type="button" data-logout>退出</button>
          </div>
        </header>
        <div class="page">
          <section class="panel">
            <form id="filters" class="filters">
              <label>设备<select id="device" name="device_id"><option value="">全部设备</option></select></label>
              <label>号码<input name="from" placeholder="发件号码" maxlength="80" /></label>
              <button type="submit">筛选</button>
            </form>
          </section>
          <div class="toolbar">
            <p id="summary" class="subtle">正在连接实时更新</p>
          </div>
          <button id="live-banner" class="banner" type="button" hidden>有新短信，点击查看</button>
          <p id="inbox-error" class="error" hidden></p>
          <div id="list" class="list" aria-live="polite"></div>
          <div class="pager">
            <button id="prev" class="secondary" type="button">上一页</button>
            <span id="page-label"></span>
            <button id="next" class="secondary" type="button">下一页</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/inbox.js"></script>
  </body>
</html>
