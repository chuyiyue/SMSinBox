<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>收件箱 · SMSinBox</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script src="/theme-boot.js"></script>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="/">
          <span class="mark" aria-hidden="true"><img src="/mark.svg" width="18" height="18" alt="" /></span>
          <span class="brand-name">SMSinBox</span>
        </a>
        <nav class="sidebar-nav" aria-label="主导航">
          <a class="active" aria-current="page" href="/">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 7 9-7"/></svg>
            <span class="nav-label">收件箱</span>
          </a>
          <a href="/devices.html">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
            <span class="nav-label">设备列表</span>
          </a>
          <a href="/notify.html">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
            <span class="nav-label">推送渠道</span>
          </a>
          <a href="/api-mcp.html">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg>
            <span class="nav-label">API 与 MCP</span>
          </a>
          <a href="/users.html">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
            <span class="nav-label">系统管理</span>
          </a>
        </nav>
        <div class="sidebar-devices" aria-labelledby="sidebar-devices-title">
          <div class="sidebar-label-row">
            <p class="sidebar-label" id="sidebar-devices-title">我的设备</p>
            <a class="ghost icon-btn sidebar-add" href="/devices.html#add" aria-label="添加设备" title="添加设备">+</a>
          </div>
          <div id="sidebar-devices" class="device-list"></div>
        </div>
        <script src="/sidebar-boot.js"></script>
      </aside>
      <div class="main">
        <header class="topbar">
          <h1 class="topbar-title">收件箱</h1>
          <p id="live-status" class="live-status" role="status"><span class="live-dot" aria-hidden="true"></span><span id="live-status-text">正在连接</span></p>
          <div class="topbar-actions">
            <button class="ghost icon-btn" type="button" data-theme-toggle aria-label="主题：跟随系统">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
              <span class="btn-label sr-only">主题：跟随系统</span>
            </button>
            <button id="refresh" class="ghost icon-btn" type="button" aria-label="刷新">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.2-5.5M20 4v6h-6"/></svg>
            </button>
          </div>
        </header>
        <div class="page">
          <div class="filterbar">
            <form id="filters" class="filters" role="search">
              <label class="filter-field">
                <span class="filter-label">设备</span>
                <select id="device" name="device_id"><option value="">全部设备</option></select>
              </label>
              <label class="filter-field">
                <span class="filter-label">号码</span>
                <input name="from" placeholder="发件号码" maxlength="80" />
              </label>
              <div class="filter-search">
                <svg class="icon filter-search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                <input class="topbar-search" type="search" name="q" maxlength="80" placeholder="搜索正文、号码或验证码" aria-label="搜索短信" />
                <span id="q-count" class="q-count" hidden></span>
              </div>
              <button id="clear-filters" class="ghost filter-clear" type="button" hidden>清除筛选</button>
            </form>
            <p id="summary" class="subtle filter-summary">共 0 条</p>
          </div>
          <div id="filter-chips" class="chips"></div>
          <p id="query-error" class="field-error" hidden>关键词过长，请缩短</p>
          <div id="search-note" class="callout warn" hidden>
            <span>已开启内容加密，仅搜索了最近 500 条。想查更早的短信，请先选择设备或号码缩小范围。</span>
            <button id="search-note-close" class="ghost" type="button">关闭</button>
          </div>
          <button id="live-banner" class="new-pill" type="button" hidden>↑ 1 条新短信</button>
          <div id="inbox-error" class="callout danger" role="alert" hidden></div>
          <div id="list" class="list message-list"></div>
          <p id="list-end" class="end-note" hidden>没有更多了 · 已到底</p>
          <div id="list-sentinel" class="sentinel"></div>
          <div id="live-announcer" class="sr-only" aria-live="polite"></div>
        </div>
      </div>
    </div>
    <nav class="tabbar" aria-label="页面">
      <a href="/" aria-current="page">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 7 9-7"/></svg>
        收件箱
      </a>
      <a href="/devices.html">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
        设备
      </a>
      <a href="/notify.html">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        推送
      </a>
      <button id="more-toggle" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18" cy="12" r="1"/></svg>
        更多
      </button>
    </nav>
    <div id="more-sheet" class="sheet" hidden>
      <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="more-title">
        <h2 id="more-title">更多</h2>
        <a href="/api-mcp.html">API 与 MCP</a>
        <a id="users-tab" href="/users.html">系统管理</a>
        <button class="ghost" type="button" data-theme-toggle><span class="btn-label">主题：跟随系统</span></button>
        <button class="ghost" type="button" data-help>快捷键</button>
        <button class="ghost" type="button" data-logout>退出登录</button>
        <button id="more-close" class="secondary" type="button">关闭</button>
      </div>
    </div>
    <script type="module" src="/inbox.js"></script>
  </body>
</html>
