<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>收件箱 · SMSinBox</title>
    <link rel="icon" href="/logo.png" type="image/png" />
    <script src="/theme-boot.js"></script>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="/">
          <span class="mark" aria-hidden="true"><img src="/logo.png" width="18" height="18" alt="" /></span>
          <span class="brand-name">SMSinBox</span>
        </a>
        <nav class="sidebar-nav" aria-label="主导航">
        </nav>
        <div class="sidebar-devices" aria-labelledby="sidebar-devices-title">
          <div class="sidebar-label-row">
            <button type="button" class="sidebar-section-toggle ghost" id="sidebar-devices-toggle" aria-expanded="true" aria-controls="sidebar-devices" title="收起设备列表" aria-label="收起设备列表">
              <svg class="icon chevron" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons.svg#icon-chevron-down"/></svg>
              <span class="sidebar-label" id="sidebar-devices-title">设备</span>
            </button>
            <a class="ghost icon-btn sidebar-add" href="/devices.html#add" aria-label="添加设备" title="添加设备">+</a>
          </div>
          <div id="sidebar-devices" class="device-list"></div>
        </div>
        <div class="sidebar-footer">
          <a class="account-btn" href="/users.html" title="系统管理" aria-label="系统管理">
            <span class="account-avatar" id="sidebar-avatar" aria-hidden="true">管</span>
            <span class="account-name btn-label" id="sidebar-account-name">管理员</span>
          </a>
          <button class="account-logout ghost" type="button" data-logout title="退出登录" aria-label="退出登录">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons.svg#icon-log-out"/></svg>
            <span class="btn-label">退出登录</span>
          </button>
        </div>
        <script src="/registry.js"></script>
        <script src="/sidebar-boot.js"></script>
      </aside>
      <div class="main">
        <header class="topbar">
          <button id="menu-toggle" class="ghost icon-btn" type="button" aria-label="打开导航" aria-expanded="false" aria-controls="sidebar">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons.svg#icon-menu"/></svg>
          </button>
          <h1 class="topbar-title">收件箱</h1>
          <p id="live-status" class="live-status" role="status"><span class="live-dot" aria-hidden="true"></span><span id="live-status-text">正在连接</span></p>
          <div class="topbar-actions">
            <button class="ghost icon-btn" type="button" data-theme-toggle aria-label="主题：跟随系统">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons.svg#icon-sun"/></svg>
              <span class="btn-label sr-only">主题：跟随系统</span>
            </button>
            <button id="refresh" class="ghost icon-btn" type="button" aria-label="刷新">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons.svg#icon-refresh"/></svg>
            </button>
          </div>
        </header>
        <div class="page">
          <div class="filterbar">
            <button id="open-filters" class="secondary mobile-filter-toggle" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="筛选" title="筛选">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons.svg#icon-filter"/></svg>
            </button>
            <div class="filter-search">
              <svg class="icon filter-search-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons.svg#icon-search"/></svg>
              <input class="topbar-search" type="search" name="q" form="filters" maxlength="80" placeholder="搜索正文、号码或验证码" aria-label="搜索短信" />
              <span id="q-count" class="q-count" hidden></span>
            </div>
            <form id="filters" class="filters" role="search">
              <label class="filter-field">
                <span class="filter-label">设备</span>
                <select id="device" name="device_id"><option value="">全部设备</option></select>
              </label>
              <label class="filter-field">
                <span class="filter-label">号码</span>
                <input name="from" placeholder="发件号码" maxlength="80" />
              </label>
              <div class="filter-range" role="group" aria-label="时间筛选">
                <div class="segmented" aria-label="时间范围">
                  <button class="segment" type="button" data-range="all" aria-pressed="true">全部</button>
                  <button class="segment" type="button" data-range="today" aria-pressed="false">今天</button>
                  <button class="segment" type="button" data-range="7d" aria-pressed="false">近 7 天</button>
                  <button class="segment" type="button" data-range="30d" aria-pressed="false">近 30 天</button>
                </div>
              </div>
              <button id="clear-filters" class="ghost filter-clear" type="button" hidden>清除筛选</button>
            </form>
            <p id="summary" class="subtle filter-summary">共 0 条</p>
          </div>
          <div id="filter-chips" class="chips"></div>
          <p id="query-error" class="field-error" hidden>关键词过长，请缩短</p>
          <div id="search-note" class="callout warn" hidden>
            <span>已开启内容加密，仅搜索了最近 500 条。想查更早的短信，请先选择设备或号码缩小范围。</span>
            <button id="search-note-close" class="ghost" type="button">关闭</button>
          </div>
          <button id="live-banner" class="new-pill" type="button" hidden>↑ 1 条新短信</button>
          <div id="inbox-error" class="callout danger" role="alert" hidden></div>
          <div id="list" class="list message-list"></div>
          <p id="list-end" class="end-note" hidden>没有更多了 · 已到底</p>
          <div id="list-sentinel" class="sentinel"></div>
          <div id="live-announcer" class="sr-only" aria-live="polite"></div>
        </div>
      </div>
    </div>
    <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>
    <script type="module" src="/inbox.js"></script>
  </body>
</html>
