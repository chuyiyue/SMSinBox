name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: smsinbox-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_CLIENT_ID_SECRET: ${{ secrets.GITHUB_OAUTH_CLIENT_ID }}
      GITHUB_CLIENT_SECRET_SECRET: ${{ secrets.GITHUB_OAUTH_CLIENT_SECRET }}
      ADMIN_GITHUB_USERNAME_SECRET: ${{ secrets.ADMIN_GITHUB_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Sync OAuth secrets to Worker
        shell: bash
        run: |
          if [[ -n "$GITHUB_CLIENT_ID_SECRET" ]]; then
            printf '%s' "$GITHUB_CLIENT_ID_SECRET" | npx wrangler secret put GITHUB_CLIENT_ID
          fi
          if [[ -n "$GITHUB_CLIENT_SECRET_SECRET" ]]; then
            printf '%s' "$GITHUB_CLIENT_SECRET_SECRET" | npx wrangler secret put GITHUB_CLIENT_SECRET
          fi
          if [[ -n "$ADMIN_GITHUB_USERNAME_SECRET" ]]; then
            printf '%s' "$ADMIN_GITHUB_USERNAME_SECRET" | npx wrangler secret put ADMIN_GITHUB_USERNAME
          fi

      - name: Apply remote D1 migrations
        # wrangler asks for confirmation; there is no TTY in CI, so pipe it.
        run: printf "y\n" | npx wrangler d1 migrations apply smsinbox --remote

      - name: Deploy Worker
        run: npx wrangler deploy
