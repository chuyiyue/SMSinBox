name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: smsinbox-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_CLIENT_ID_SECRET: ${{ secrets.GH_OAUTH_CLIENT_ID }}
      GH_CLIENT_SECRET_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Sync OAuth secrets to Worker
        shell: bash
        run: |
          if [[ -n "$GH_CLIENT_ID_SECRET" ]]; then
            printf '%s' "$GH_CLIENT_ID_SECRET" | npx wrangler secret put GH_CLIENT_ID
          fi
          if [[ -n "$GH_CLIENT_SECRET_SECRET" ]]; then
            printf '%s' "$GH_CLIENT_SECRET_SECRET" | npx wrangler secret put GH_CLIENT_SECRET
          fi

      - name: Apply remote D1 migrations
        run: npx wrangler d1 migrations apply smsinbox --remote

      - name: Deploy Worker
        run: npx wrangler deploy
