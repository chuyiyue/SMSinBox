name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: smsinbox-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_CLIENT_ID_SECRET: ${{ secrets.GH_CLIENT_ID }}
      GH_CLIENT_SECRET_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
      AI_MODEL_SECRET: ${{ secrets.AI_MODEL }}
      ADMIN_USERNAME_SECRET: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD_SECRET: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Sync OAuth secrets to Worker
        shell: bash
        run: |
          if [[ -n "$GH_CLIENT_ID_SECRET" ]]; then
            printf '%s' "$GH_CLIENT_ID_SECRET" | npx wrangler secret put GH_CLIENT_ID
          fi
          if [[ -n "$GH_CLIENT_SECRET_SECRET" ]]; then
            printf '%s' "$GH_CLIENT_SECRET_SECRET" | npx wrangler secret put GH_CLIENT_SECRET
          fi

      - name: Sync AI model secret to Worker
        shell: bash
        run: |
          if [[ -n "$AI_MODEL_SECRET" ]]; then
            printf '%s' "$AI_MODEL_SECRET" | npx wrangler secret put AI_MODEL
          fi

      - name: Apply remote D1 migrations
        run: npx wrangler d1 migrations apply smsinbox --remote

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Sync admin secrets to Worker
        shell: bash
        run: |
          if [[ -n "$ADMIN_USERNAME_SECRET" && -n "$ADMIN_PASSWORD_SECRET" ]]; then
            printf '%s' "$ADMIN_USERNAME_SECRET" | npx wrangler secret put ADMIN_USERNAME
            printf '%s' "$ADMIN_PASSWORD_SECRET" | npx wrangler secret put ADMIN_PASSWORD
          fi

      - name: Sync admin row
        shell: bash
        run: |
          if [[ -n "$ADMIN_USERNAME_SECRET" && -n "$ADMIN_PASSWORD_SECRET" ]]; then
            ADMIN_USERNAME="$ADMIN_USERNAME_SECRET" ADMIN_PASSWORD="$ADMIN_PASSWORD_SECRET" npm run sync-admin
          fi
